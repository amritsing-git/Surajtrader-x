/* =========================================================
   ESCAPE
========================================================= */

function esc(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   MOBILE MENU
========================================================= */

function toggleAdminMenu(){

  const sidebar =
    document.getElementById(
      "adminSidebar"
    );

  if(sidebar){

    sidebar.classList.toggle(
      "show"
    );

  }

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  type,
  text
){

  const old =
    document.querySelector(
      ".admin-message"
    );

  if(old){
    old.remove();
  }


  const box =
    document.createElement(
      "div"
    );


  box.className =
    "admin-message " +
    (
      type === "success"
        ? "admin-success"
        : type === "error"
          ? "admin-error"
          : "admin-info"
    );


  box.textContent =
    text;


  const app =
    document.getElementById(
      "app"
    );


  app.prepend(box);


  window.scrollTo({

    top:0,

    behavior:"smooth"

  });

}


/* =========================================================
   CONFIRM MODAL
========================================================= */

function openConfirm(
  title,
  text,
  buttonText,
  danger,
  callback
){

  document
    .getElementById(
      "modalTitle"
    )
    .textContent =
    title;


  document
    .getElementById(
      "modalText"
    )
    .textContent =
    text;


  document
    .getElementById(
      "modalConfirm"
    )
    .textContent =
    buttonText;


  document
    .getElementById(
      "modalConfirm"
    )
    .className =
    danger
      ? "btn danger-btn"
      : "btn btn-dark";


  document
    .getElementById(
      "modalTag"
    )
    .textContent =
    danger
      ? "Reject payment"
      : "Approve payment";


  pendingAction =
    callback;


  document
    .getElementById(
      "confirmModal"
    )
    .classList.add(
      "show"
    );

}


function closeConfirm(){

  document
    .getElementById(
      "confirmModal"
    )
    .classList.remove(
      "show"
    );

  pendingAction =
    null;

}


document
  .getElementById(
    "modalCancel"

  .addEventListener(
    "click",
    closeConfirm
  );


document
  .getElementById(
    "modalConfirm"
  )

    "click",
    async function(){

        pendingAction;

      closeConfirm();

  );

    "confirmModal"
  )

    "click",
    function(e){

/* =========================================================
   FIXED PRODUCT GET / CREATE
========================================================= */

async function getOrCreateProduct(
  product
){

  const found =
    await S

      .from("courses")

      .select(
        "id,title,slug,description,published"
      )

      .eq(
        "slug",
        product.slug
      )

      .maybeSingle();


  if(found.error){

    throw new Error(
      found.error.message
    );

  }


  if(found.data){

    return found.data;

  }


  const created =
    await S

      .from("courses")

      .insert({

        title:
          product.title,

        slug:
          product.slug,

        description:
          product.description,

        published:
          true

      })

      .select()

      .single();


  if(created.error){

    throw new Error(
      "Could not create fixed product: " +
      created.error.message
    );

  }


  return created.data;

}


/* =========================================================
   SAFE SUPABASE HELPERS
========================================================= */

function withTimeout(promise, ms, label){
  return Promise.race([
    promise,
    new Promise((_, reject)=>{
      setTimeout(()=>{
        reject(new Error(label + " timed out. Check internet/Supabase connection."));
      }, ms);
    })
  ]);
}

async function getAdminClient(){
  if(!window.supabase){
    throw new Error("Supabase library did not load. Check your internet connection.");
  }

  if(!window.SRTX_CONFIG ||
     !SRTX_CONFIG.SUPABASE_URL ||
     !SRTX_CONFIG.SUPABASE_ANON_KEY ||
     SRTX_CONFIG.SUPABASE_URL.includes("PASTE_")){
    throw new Error("Supabase configuration is missing in config.js.");
  }

  return window.supabase.createClient(
    SRTX_CONFIG.SUPABASE_URL,
    SRTX_CONFIG.SUPABASE_ANON_KEY
  );
}

function showBootError(message){
  const app = document.getElementById("app");
  if(!app) return;

  app.innerHTML = `
    <div class="card">
      <span class="tag">Admin Panel</span>
      <h2>Admin panel could not load</h2>
      <p class="muted" style="white-space:pre-wrap">${esc(message)}</p>
      <div class="notice warn" style="margin-top:16px">
        This admin page now contains its own Supabase configuration.
        If this message appears again, the exact error above is the important part.
      </div>
      <button class="btn btn-dark" type="button"
        onclick="location.reload()">Refresh</button>
    </div>
  `;
}


/* =========================================================
   BOOT
========================================================= */


async function boot(){

  try{

    /*
      The admin panel creates its own Supabase client.
      This prevents a stuck helper in another JS file from
      leaving the page permanently on "Loading admin…".
    */
    S =
      await getAdminClient();


    const sessionResult =
      await withTimeout(
        S.auth.getSession(),
        10000,
        "Supabase session check"
      );


    if(
      sessionResult.error ||
      !sessionResult.data.session
    ){

      location.href =
        "login.html";

      return;

    }


    ME =
      sessionResult.data.session.user;


    const adminResult =
      await withTimeout(
        S
          .from("admin_users")
          .select("user_id")
          .eq("user_id", ME.id)
          .maybeSingle(),
        10000,
        "Admin permission check"
      );


    if(adminResult.error){

      showBootError(
        "Admin verification failed:\n" +
        adminResult.error.message
      );

      return;

    }


    if(!adminResult.data){

      document.getElementById("app").innerHTML = `

        <div class="card">

          <span class="tag">
            Access denied
          </span>

          <h2>
            This account is not an admin.
          </h2>

          <p class="muted">
            Add the Auth user's UUID to admin_users.
          </p>

          <a
            class="btn btn-dark"
            href="student.html"
          >
            Go to Student Area
          </a>

        </div>

      `;

      return;

    }


    await render();


  }catch(error){

    console.error(
      "Admin boot error:",
      error
    );

    showBootError(
      error?.message ||
      "Unknown error while loading the admin panel."
    );

  }

}

/* =========================================================
   DATE
========================================================= */

function safeDate(
  value
){

  if(!value){

    return "—";

  }


  const date =
    new Date(
      value
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return "—";

  }


  return date.toLocaleDateString(
    "en-IN"
  );

}


/* =========================================================
   REQUEST APPROVE
========================================================= */

async function requestApprove(
  id,
  userId,
  plan,
  amount
){

  try{

    const cleanPlan =
      String(
        plan || ""
      )
      .trim()
      .toLowerCase();


    const pricing =
      PRICING.find(
        row =>
          row.plan ===
          cleanPlan
      );


    let expected;


    if(pricing){

      expected =
        Number(
          pricing.price
        );

    }else{

      expected = {

        basic:
          1499,

        premium:
          2499,

        renewal:
          699

      }[
        cleanPlan
      ];

    }


    if(
      !Number.isFinite(
        expected
      )
    ){

      showMessage(
        "error",
        "Unknown payment plan: " +
        cleanPlan
      );

      return;

    }


    if(
      Number(amount) !==
      expected
    ){

      showMessage(
        "error",
        "Plan amount mismatch. Expected ₹" +
        expected.toLocaleString(
          "en-IN"
        ) +
        " but payment request is ₹" +
        Number(
          amount
        ).toLocaleString(
          "en-IN"
        ) +
        "."
      );

      return;

    }


    /*
      IMPORTANT:
      Renewal does NOT check Premium enrollment.
      It is a completely separate product.
    */

    const message =
      cleanPlan === "renewal"

        ?

        "Verify the actual ₹699 UPI/bank transaction. This will create/activate the student's separate Premium Telegram Renewal product. It will NOT modify the NIFTY Premium course."

        :

        "Verify the actual UPI/bank transaction and exact amount before approving this NIFTY course payment.";


    openConfirm(

      "Approve Payment",

      message,

      "Approve",

      false,

      async function(){

        await approvePayment(
          id,
          userId,
          cleanPlan,
          amount
        );

      }

    );


  }catch(error){

    showMessage(
      "error",
      error.message ||
      "Could not start approval."
    );

  }

}


/* =========================================================
   APPROVE PAYMENT
========================================================= */

async function approvePayment(
  id,
  userId,
  plan,
  amount
){

  try{

    /*
      ==========================================
      BASIC
      ==========================================
      Main NIFTY course.
    */

    if(
      plan ===
      "basic"
    ){

      const course =
        await getOrCreateProduct(
          NIFTY_COURSE
        );


      const payment =
        await approvePaymentRequest(
          id
        );


      if(payment.error){

        showMessage(
          "error",
          payment.error.message
        );

        return;

      }


      const enrollment =
        await S

          .from("enrollments")

          .upsert({

            user_id:
              userId,

            course_id:
              course.id,

            plan:
              "basic",

            status:
              "active",

            amount_paid:
              Number(amount),

            payment_request_id:
              id

          },{
            onConflict:
              "user_id,course_id"
          });


      if(enrollment.error){

        await rollbackPayment(
          id
        );


        showMessage(
          "error",
          "Enrollment failed: " +
          enrollment.error.message
        );

        return;

      }


      showMessage(
        "success",
        "Basic payment approved. NIFTY Basic access is active."
      );


      await render();

      return;

    }


    /*
      ==========================================
      PREMIUM
      ==========================================
      Main NIFTY course.
    */

    if(
      plan ===
      "premium"
    ){

      const course =
        await getOrCreateProduct(
          NIFTY_COURSE
        );


      const payment =
        await approvePaymentRequest(
          id
        );


      if(payment.error){

        showMessage(
          "error",
          payment.error.message
        );

        return;

      }


      const enrollment =
        await S

          .from("enrollments")

          .upsert({

            user_id:
              userId,

            course_id:
              course.id,

            plan:
              "premium",

            status:
              "active",

            amount_paid:
              Number(amount),

            payment_request_id:
              id

          },{
            onConflict:
              "user_id,course_id"
          });


      if(enrollment.error){

        await rollbackPayment(
          id
        );


        showMessage(
          "error",
          "Premium enrollment failed: " +
          enrollment.error.message
        );

        return;

      }


      showMessage(
        "success",
        "Premium payment approved. NIFTY Premium access is active."
      );


      await render();

      return;

    }


    /*
      ==========================================
      RENEWAL
      ==========================================

      THIS IS THE IMPORTANT FIX.

      There is:
      - NO NIFTY course lookup
      - NO Premium enrollment lookup
      - NO downgrade logic
      - NO modification of NIFTY enrollment

      It gets its OWN course/product.
    */

    if(
      plan ===
      "renewal"
    ){

      const renewalCourse =
        await getOrCreateProduct(
          TELEGRAM_RENEWAL
        );


      const payment =
        await approvePaymentRequest(
          id
        );


      if(payment.error){

        showMessage(
          "error",
          payment.error.message
        );

        return;

      }


      const renewalEnrollment =
        await S

          .from("enrollments")

          .upsert({

            user_id:
              userId,

            course_id:
              renewalCourse.id,

            plan:
              "renewal",

            status:
              "active",

            amount_paid:
              Number(amount),

            payment_request_id:
              id

          },{
            onConflict:
              "user_id,course_id"
          });


      if(
        renewalEnrollment.error
      ){

        await rollbackPayment(
          id
        );


        showMessage(
          "error",
          "Renewal enrollment failed: " +
          renewalEnrollment.error.message
        );

        return;

      }


      showMessage(
        "success",
        "₹699 Premium Telegram Renewal approved. It is completely separate from the NIFTY course."
      );


      await render();

      return;

    }


    showMessage(
      "error",
      "Unsupported payment plan: " +
      plan
    );


  }catch(error){

    console.error(
      "approvePayment error:",
      error
    );


    showMessage(
      "error",
      error.message ||
      "Something went wrong while approving the payment."
    );

  }

}


/* =========================================================
   APPROVE PAYMENT REQUEST
========================================================= */

async function approvePaymentRequest(
  id
){

  return await S

    .from(
      "payment_requests"
    )

    .update({

      status:
        "approved",

      approved_by:
        ME.id,

      approved_at:
        new Date().toISOString()

    })

    .eq(
      "id",
      id
    )

    .eq(
      "status",
      "pending"
    );

}


/* =========================================================
   ROLLBACK
========================================================= */

async function rollbackPayment(
  id
){

  await S

    .from(
      "payment_requests"
    )

    .update({

      status:
        "pending",

      approved_by:
        null,

      approved_at:
        null

    })

    .eq(
      "id",
      id
    );

}


/* =========================================================
   REJECT REQUEST
========================================================= */

function requestReject(
  id
){

  openConfirm(

    "Reject Payment",

    "Are you sure you want to reject this payment request?",

    "Reject Payment",

    true,

    async function(){

      await rejectPayment(
        id
      );

    }

  );

}


async function rejectPayment(
  id
){

  const result =
    await S

      .from(
        "payment_requests"
      )

      .update({

        status:
          "rejected",

        approved_by:
          ME.id,

        approved_at:
          new Date().toISOString()

      })

      .eq(
        "id",
        id
      )

      .eq(
        "status",
        "pending"
      );


  if(result.error){

    showMessage(
      "error",
      result.error.message
    );

    return;

  }


  showMessage(
    "success",
    "Payment request rejected."
  );


  await render();

}


/* =========================================================
   SAVE PRICING
========================================================= */

async function savePricing(){

  const button =
    document.getElementById(
      "savePricingBtn"
    );


  button.disabled =
    true;


  button.textContent =
    "Saving…";


  try{

    const plans = [
      "basic",
      "premium",
      "renewal"
    ];


    for(
      const plan of plans
    ){

      const price =
        Number(
          document.querySelector(
            `.price-input[data-plan="${plan}"][data-field="price"]`
          ).value
        );


      const compareAt =
        Number(
          document.querySelector(
            `.price-input[data-plan="${plan}"][data-field="compare_at"]`
          ).value
        );


      const active =
        document.querySelector(
          `.price-active[data-plan="${plan}"]`
        ).checked;


      if(
        !Number.isFinite(
          price
        ) ||
        price < 0
      ){

        throw new Error(
          plan +
          " selling price is invalid."
        );

      }


      if(
        !Number.isFinite(
          compareAt
        ) ||
        compareAt < 0
      ){

        throw new Error(
          plan +
          " original price is invalid."
        );

      }


      if(
        compareAt > 0 &&
        compareAt < price
      ){

        throw new Error(
          plan +
          " original price cannot be lower than selling price."
        );

      }


      const existing =
        PRICING.find(
          row =>
            row.plan ===
            plan
        );


      const names = {

        basic:
          "Basic — Weekly Live Doubt Solving",

        premium:
          "Premium — Daily Live Doubt Solving + Mentorship",

        renewal:
          "Premium Telegram Renewal"

      };


      const result =
        await S

          .from(
            "plan_pricing"
          )

          .upsert({

            plan:
              plan,

            name:
              existing?.name ||
              names[plan],

            price:
              price,

            compare_at:
              compareAt,

            active:
              active,

            updated_at:
              new Date().toISOString()

          },{
            onConflict:
              "plan"
          });


      if(result.error){

        throw new Error(
          result.error.message
        );

      }

    }


    showMessage(
      "success",
      "Pricing updated successfully."
    );


    await render();


  }catch(error){

    showMessage(
      "error",
      "Pricing update failed: " +
      (
        error.message ||
        "Unknown error"
      )
    );

    button.disabled =
      false;

    button.textContent =
      "Save Pricing";

  }

}

async function addModule(
  e
){

  e.preventDefault();


  const title =
    document
      .getElementById(
        "moduleTitle"
      )
      .value
      .trim();


  const description =
    document
      .getElementById(
        "moduleDescription"
      )
      .value
      .trim();


  const position =
    Number(
      document
        .getElementById(
          "modulePosition"
        )
        .value
    );


  if(
    !title ||
    !description
  ){

    showMessage(
      "error",
      "Module title and description are required."
    );

    return;

  }


  try{

    const course =
      await getOrCreateProduct(
        NIFTY_COURSE
      );


    const moduleResult =
      await S

        .from(
          "modules"
        )

        .insert({

          course_id:
            course.id,

          title:
            title,

          position:
            position

        })

        .select()
        .single();


    if(moduleResult.error){

      showMessage(
        "error",
        moduleResult.error.message
      );

      return;

    }


    /*
      Existing schema uses lessons for content,
      so module description is stored as overview lesson.
    */

    const lessonResult =
      await S

        .from(
          "lessons"
        )

        .insert({

          module_id:
            moduleResult.data.id,

          title:
            "Module Overview",

          content:
            description,

          position:
            1

        });


    if(lessonResult.error){

      showMessage(
        "error",
        "Module created but overview could not be saved: " +
        lessonResult.error.message
      );

      return;

    }


    showMessage(
      "success",
      "Module added successfully."
    );


    await render();


  }catch(error){

    showMessage(
      "error",
      error.message ||
      "Could not add module."
    );

  }

}

      "Select a module and enter lesson title."
    );

    return;

  }


  const result =
    await S

      .from(
        "lessons"
      )

      .insert({

        module_id:
          moduleId,

        title:
          title,

        content:
          content,

        video_url:
          video ||
          null,

        position:
          position

      });


  if(result.error){

    showMessage(
      "error",
      result.error.message
    );

    return;

  }


  showMessage(
    "success",
    "Lesson added successfully."
  );


  await render();

}


/* =========================================================
   CHANGE PASSWORD
========================================================= */

async function changePassword(
  e
){

  e.preventDefault();


  const password =
    document
      .getElementById(
        "newPassword"
      )
      .value;


  const confirm =
    document
      .getElementById(
        "confirmPassword"
      )
      .value;


  if(
    password !==
    confirm
  ){

    showMessage(
      "error",
      "Passwords do not match."
    );

    return;

  }


  if(
    password.length <
    8
  ){

    showMessage(
      "error",
      "Password must be at least 8 characters."
    );

    return;

  }


  const result =
    await S.auth.updateUser({

      password:
        password

    });


  if(result.error){

    showMessage(
      "error",
      result.error.message
    );

    return;

  }


  e.target.reset();


  showMessage(
    "success",
    "Admin password updated successfully."
  );

}


/* =========================================================
   GLOBAL ERROR HANDLER
========================================================= */

window.addEventListener("unhandledrejection", function(event){

  console.error(
    "Unhandled admin promise:",
    event.reason
  );

  if(
    document
      .getElementById("app")
      ?.textContent
      ?.includes("Loading admin")
  ){

    showBootError(
      event.reason?.message ||
      "An unexpected Supabase error occurred."
    );

  }

});


/* =========================================================
   START
========================================================= */

boot();
