<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — SURAJTRADERX</title><link rel="stylesheet" href="style.css"><link rel="icon" type="image/jpeg" href="assets/srtx-logo.jpg"></head><body data-page="">
<div class="topbar">SURAJTRADERX • Secure account recovery</div><main><section class="section"><div class="container" style="max-width:520px"><span class="tag">Account recovery</span><h1>Set a new password.</h1><div class="card"><form id="resetForm" class="form"><div class="field"><label>New password</label><input id="newPassword" type="password" minlength="8" required></div><div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" minlength="8" required></div><button class="btn btn-dark">Update password</button><div id="msg" class="small"></div></form></div></div></section></main><div data-footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script src="supabase.js"></script><script>
resetForm.addEventListener('submit',async e=>{e.preventDefault();if(newPassword.value!==confirmPassword.value){msg.innerHTML='<span class="error">Passwords do not match.</span>';return}const s=await initSB();if(!s){msg.innerHTML='<span class="error">Configure Supabase first.</span>';return}const r=await s.auth.updateUser({password:newPassword.value});if(r.error)msg.innerHTML='<span class="error">'+esc(r.error.message)+'</span>';else{msg.innerHTML='<span class="success">Password updated. Redirecting to login…</span>';setTimeout(()=>location.href='login.html',1200)}});
</script></body></html>
